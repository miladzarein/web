<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
            display: block;
        }
        .errorlist {
            list-style: none;
            background: #ffebee;
            color: #c62828;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
        }
        input {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 2px solid #ddd;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #4caf50;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover {
            background: #43a047;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-container">

    <h2>ثبت نام</h2>

    <form method="post" action="{% url 'accounts:signup' %}">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit">ایجاد حساب</button>
    </form>

</div>

</body>
</html>
